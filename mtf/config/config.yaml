
seed: 42
data: 
    data_dir: "data/train_data"
    class_names: ["cloth", "leather", "metal", "wood"]
    sequence_length: 1024
    signal_normalize: "per_sample"  # 可选: none / per_sample
    image_size: 224
    image_line_width: 1
    image_normalize: True
    val_ratio: 0.2
    num_workers: 0

model: 
    num_classes: 4
    time_encoder: 
        input_channels: 2
        stem_channels: 32
        stem_kernel_size: 7
        stem_stride: 2
        block_channels: [64, 128, 256]
        block_strides: [2, 2, 2]
        block_kernel_size: 3
        feature_dim: 128
        dropout: 0.2
        use_batch_norm: True
    image_encoder: 
        input_channels: 3
        channels: [32, 64, 128, 128]
        kernel_size: 3
        pool_every: [True, True, True, False]
        feature_dim: 128
        dropout: 0.2
        use_batch_norm: True
    fusion: 
        hidden_dims: [128, 64]
        dropouts: [0.3, 0.2]
train: 
    num_epochs: 100
    batch_size: 8
    lr: 1e-3
    weight_decay: 1e-4
    device: "cuda:0"  
    print_every: 1
    save_dir: "data/output/mtf"
  