num_steps: 100

seed: 42

diffusion:
  num_steps: 100
  beta_start: 1e-4
  beta_end: 0.02
  hidden_channels: 64
  num_classes: 4

data: 
    data_dir: "data/train_data2_30ep"
    class_names: ["cloth", "leather", "metal", "wood"]
    sequence_length: 1024
    signal_normalize: "per_sample"  # 可选: none / per_sample
    image_size: 224
    image_line_width: 1
    image_normalize: True
    val_ratio: 0.2
    num_workers: 0

train: 
    num_epochs: 200
    batch_size: 4
    lr: 1e-4
    weight_decay: 1e-4
    device: "cuda:0"  
    print_every: 1
    save_dir: "data/output/diffusion/"
  